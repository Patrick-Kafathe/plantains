<style>
:root{--g:#2f6b2f;--deep:#143417;--sun:#f2b61f;--bg:#f3f5ee;--ink:#1d2a1b;--mut:#66745f;--line:#e1e7d6;--h:'Outfit',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--b);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}[hidden]{display:none!important}
.i{display:inline-flex;vertical-align:middle}
/* gate */
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(150deg,var(--deep),#2f6b2f)}
.gbox{background:#fff;border-radius:24px;padding:40px 34px;width:100%;max-width:400px;text-align:center;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.gbox img{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.gbox h1{font:800 1.5rem var(--h);color:var(--deep)}.gbox p{color:var(--mut);font-size:.9rem;margin:6px 0 20px}
.gbox input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;margin-bottom:12px;text-align:center}
.err{color:#b3261e;font-size:.84rem;min-height:20px;margin-bottom:6px}
/* layout */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--deep);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.bk{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.bk img{width:46px;height:46px;border-radius:50%;background:#fff}
.bk b{font:800 1.02rem/1.15 var(--h)}.bk small{display:block;opacity:.6;font-size:.72rem;font-weight:400}
aside nav{display:grid;gap:3px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:0;background:none;color:#cfe0c4;font:500 .92rem var(--b);text-align:left;transition:.15s}
.nv:hover{background:rgba(255,255,255,.08);color:#fff}
.nv.on{background:var(--sun);color:#2b1f00;font-weight:600}
main{padding:0 0 60px;min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,238,.92);backdrop-filter:blur(10px);padding:16px 30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.top h1{font:800 1.5rem var(--h);color:var(--deep);margin-right:auto}
.st{font-size:.78rem;color:var(--mut);display:flex;align-items:center;gap:6px}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:#7bc043}
.st.dirty::before{background:var(--sun)}
.pg{padding:26px 30px;max-width:1000px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;border:0;background:var(--g);color:#fff;font:600 .88rem var(--b);transition:.15s;text-decoration:none}
.btn:hover{background:var(--deep)}
.btn.sun{background:var(--sun);color:#2b1f00}.btn.sun:hover{background:#e0a615}
.btn.s{padding:8px 14px;font-size:.8rem;border-radius:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{background:#f6f8f1}
.btn.add{background:#eaf3dd;color:var(--g);width:100%;justify-content:center;border:1.5px dashed #b6d198;padding:14px}.btn.add:hover{background:#dcebc8}
.card{background:#fff;border-radius:18px;padding:24px;margin-bottom:22px;box-shadow:0 6px 20px -12px rgba(20,52,23,.2)}
.card>h2{font:700 1.2rem var(--h);color:var(--deep)}
.card>p.sub{color:var(--mut);font-size:.88rem;margin:4px 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.f{display:grid;gap:6px;margin-bottom:14px;align-content:start}
.f>span{font:600 .78rem var(--b);color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.f small{color:var(--mut);font-size:.76rem}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=password],input:not([type]),select,textarea{font:400 .93rem var(--b);padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fbfcf8;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px rgba(47,107,47,.12)}
input[type=color]{width:100%;height:46px;border:1.5px solid var(--line);border-radius:11px;padding:4px;background:#fbfcf8}
.thumb{height:150px;border-radius:12px;border:2px dashed #c9d6b6;background:#f4f8ec;display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:.84rem;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:14px}
.item{border:1.5px solid var(--line);border-radius:16px;background:#fcfdf9;overflow:hidden}
.item-h{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;background:#f1f6e8;border-bottom:1px solid var(--line)}
.item-h b{font:700 .95rem var(--h);color:var(--deep)}.sp{flex:1}
.ib{width:34px;height:34px;border-radius:9px;border:0;background:#fff;color:var(--mut);display:grid;place-items:center}
.ib:hover{background:var(--g);color:#fff}.ib.del:hover{background:#c62828}
.item-b{padding:16px;display:grid;grid-template-columns:230px 1fr;gap:18px}
.item-b .col{min-width:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
.gi{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.gi .thumb{height:130px;border:0;border-radius:0}
.gi .b{padding:10px;display:grid;gap:8px}
.gi select,.gi input{padding:8px 10px;font-size:.82rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px -12px rgba(20,52,23,.2)}
.stat b{display:block;font:800 1.9rem var(--h);color:var(--g)}.stat span{font-size:.8rem;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:#e7eedb;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#8bc34a)}
ol.steps{margin:12px 0 0 20px;display:grid;gap:8px;font-size:.92rem}
.tip{background:#fff8e1;border:1px solid #f1dc9a;border-radius:12px;padding:12px 14px;font-size:.84rem;color:#6b5200;margin-top:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--deep);color:#fff;padding:12px 22px;border-radius:99px;font-size:.88rem;opacity:0;transition:.3s;z-index:300;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,25,12,.6);z-index:200;display:grid;place-items:center;padding:20px}
.mbox{background:#fff;border-radius:22px;padding:30px;max-width:540px;width:100%}
.mbox h2{font:800 1.4rem var(--h);color:var(--deep);margin-bottom:6px}
.item-b .wide{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:14px}
.sect{margin-bottom:12px;font-size:.84rem;color:var(--mut)}.sect b{font:700 .95rem var(--h);color:var(--deep)}
.lbl{display:block;font:600 .78rem var(--b);color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 8px}
.mgal{display:flex;gap:8px;flex-wrap:wrap}.mt{color:var(--mut);font-size:.82rem}
.mth{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}.mth img{width:100%;height:100%;object-fit:cover}
.mth .ib{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%}
input[type=range]{flex:1;min-width:180px;accent-color:var(--g);padding:0;border:0;background:none}
@media(max-width:900px){
 #app{grid-template-columns:1fr}
 aside{position:static;height:auto;padding:12px}
 .bk{padding:0 6px 10px}
 aside nav{display:flex;overflow:auto;gap:6px;padding-bottom:4px}.nv{white-space:nowrap;padding:10px 14px}
 .top{padding:12px 16px;position:static}.pg{padding:18px 16px}
 .grid2,.grid3,.item-b{grid-template-columns:1fr}
}
</style>
</head>
