<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Plantains Place | Homestay & Retreat in Karatina</title>
<meta name="description" content="The Plantains Place: guest rooms, swimming pool, events garden and good food in Karatina, Kenya.">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#2f6b2f;--sun:#f2b61f;--deep:#143417;--ink:#1d2a1b;--mut:#5b6957;--cream:#faf7ee;--sand:#f1ecda;--r:20px;--h:'Outfit',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:var(--b);color:var(--ink);background:var(--cream);line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}ul{list-style:none}button{font-family:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
section{padding:56px 0}
h1,h2,h3,h4{font-family:var(--h);line-height:1.1;letter-spacing:-.01em}

/* section titles */
.head{text-align:center;max-width:620px;margin:0 auto 26px}
.eyebrow{display:inline-block;font:600 .68rem/1 var(--b);letter-spacing:.16em;text-transform:uppercase;color:var(--g);background:rgba(47,107,47,.1);padding:7px 12px;border-radius:99px}
.head h2,.ttl{font-size:clamp(1.45rem,2.8vw,2.05rem);font-weight:700;color:var(--deep);margin:10px 0 8px}
.head p{color:var(--mut);font-size:.9rem}

/* buttons */
.btn{--bg:var(--sun);--fg:#2b1f00;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:99px;border:2px solid var(--bg);background:var(--bg);color:var(--fg);font:600 .85rem/1 var(--b);cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,color .2s;box-shadow:0 8px 22px -8px rgba(0,0,0,.35);position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(0,0,0,.4)}
.btn:active{transform:translateY(0)}
.btn-sun{background:linear-gradient(135deg,#ffd45a,var(--sun) 55%,#e98b1b);border-color:transparent}
.btn-dark{--bg:var(--deep);--fg:#fff}.btn-dark:hover{background:var(--g);border-color:var(--g)}
.btn-green{--bg:var(--g);--fg:#fff}.btn-green:hover{background:var(--deep);border-color:var(--deep)}
.btn-line{--bg:transparent;--fg:#fff;border-color:rgba(255,255,255,.7);box-shadow:none;backdrop-filter:blur(4px)}.btn-line:hover{background:#fff;color:var(--deep);border-color:#fff}
.btn-out{--bg:transparent;--fg:var(--g);border-color:var(--g);box-shadow:none}.btn-out:hover{background:var(--g);color:#fff}
.btn-wa{--bg:#25d366;--fg:#fff}.btn-wa:hover{background:#1ebe5b;border-color:#1ebe5b}
.btn-sm{padding:8px 15px;font-size:.8rem}.btn .ic{width:16px;height:16px}
.btn-block{width:100%}

/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:60;transition:background .3s,box-shadow .3s}
header.solid{background:rgba(250,247,238,.95);box-shadow:0 4px 24px rgba(20,52,23,.1);backdrop-filter:blur(10px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font:700 1.02rem/1 var(--h)}
.brand .lg{width:42px;height:42px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25);flex:none}
.brand .lg img{width:100%;height:100%;object-fit:contain}
.brand small{display:block;font:500 .58rem/1.2 var(--b);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:3px}
header.solid .brand{color:var(--deep)}
nav ul{display:flex;gap:6px;align-items:center}
nav li a:not(.btn){display:block;padding:7px 11px;border-radius:99px;font-weight:500;font-size:.84rem;color:#fff;transition:.2s}
nav li a:not(.btn):hover{background:rgba(255,255,255,.18)}
header.solid nav li a:not(.btn){color:var(--ink)}header.solid nav li a:not(.btn):hover{background:rgba(47,107,47,.1)}
.burger{display:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;place-items:center}
header.solid .burger{background:rgba(47,107,47,.1);color:var(--deep)}
@media(max-width:1020px){
 .burger{display:grid}
 nav ul{position:fixed;inset:64px 0 auto 0;background:var(--cream);flex-direction:column;align-items:stretch;padding:16px 22px 26px;gap:2px;box-shadow:0 20px 30px rgba(0,0,0,.15);transform:translateY(-130%);transition:transform .3s;max-height:calc(100vh - 64px);overflow:auto}
 nav ul.open{transform:none}
 nav li a:not(.btn){color:var(--ink)!important;padding:13px 10px;border-radius:12px}
 nav li .btn{margin-top:10px;width:100%}
}

/* media / placeholders */
.m{position:relative;overflow:hidden;background:var(--deep)}
.m img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:rgba(255,255,255,.85);font:600 .8rem var(--b);letter-spacing:.06em;
 background:radial-gradient(circle at 20% 25%,rgba(156,204,60,.5),transparent 45%),radial-gradient(circle at 85% 80%,rgba(242,182,31,.45),transparent 42%),linear-gradient(135deg,#1f4a22,#2f6b2f)}
.ph::before{content:"";position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(60deg,transparent 0 22px,rgba(255,255,255,.5) 22px 23px)}
.ph span{position:relative}

/* hero */
.hero{position:relative;height:min(78svh,560px);min-height:470px;color:#fff;padding:0;overflow:hidden}
.hs{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
.hs.on{opacity:1;pointer-events:auto}
.hs .m{position:absolute;inset:0}
.hs.on .m img{animation:kb 10s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.hs::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,30,12,.95) 0%,rgba(10,30,12,.82) 28%,rgba(10,30,12,.4) 58%,rgba(10,30,12,0) 85%),linear-gradient(0deg,rgba(10,30,12,.6),transparent 30%)}
.hs-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:1200px;margin:0 auto;padding:70px 22px 84px}.hs-in>*{max-width:470px}
.hs-in .eyebrow{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px)}
.hs-in h1{font-size:clamp(1.7rem,3.6vw,2.7rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:14px 0 10px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hs-in p{font-size:.9rem;opacity:.9;margin-bottom:20px;line-height:1.55}
.hs-in>*{opacity:0;transform:translateY(22px);transition:opacity .8s .25s,transform .8s .25s}
.hs.on .hs-in>*{opacity:1;transform:none}
.hs.on .hs-in h1{transition-delay:.35s}.hs.on .hs-in p{transition-delay:.5s}.hs.on .hs-in .cta{transition-delay:.65s}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-nav{position:absolute;z-index:5;right:22px;bottom:76px;display:flex;gap:10px}
.arw{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s}
.arw:hover{background:#fff;color:var(--deep)}
.dots{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:76px;display:flex;gap:7px}
.dots button{width:8px;height:8px;border-radius:99px;border:0;background:rgba(255,255,255,.5);cursor:pointer;transition:.3s;padding:0}
.dots button.on{width:24px;background:var(--sun)}
.strip{position:absolute;z-index:6;left:0;right:0;bottom:0;background:rgba(20,52,23,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.si{display:flex;gap:10px;align-items:center;padding:11px 6px;font-size:.8rem}
.si .ico{width:32px;height:32px;border-radius:50%;background:rgba(242,182,31,.18);color:var(--sun);display:grid;place-items:center;flex:none}
.si .ic{width:16px;height:16px}.si b{display:block;font:600 .6rem var(--b);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
@media(max-width:900px){.strip .wrap{grid-template-columns:1fr 1fr}.si{padding:8px 4px}.hero-nav{display:none}.dots{bottom:92px;left:22px;transform:none}.hs-in{padding-bottom:120px}.hero{height:auto;min-height:500px}}
@media(max-width:520px){.strip .wrap{grid-template-columns:1fr 1fr}.si:nth-child(n+3){display:none}.si span:last-child{font-size:.74rem}.hs-in{padding-bottom:104px}.dots{bottom:66px}.hs::after{background:linear-gradient(90deg,rgba(10,30,12,.92),rgba(10,30,12,.6) 70%,rgba(10,30,12,.35)),linear-gradient(0deg,rgba(10,30,12,.6),transparent 30%)}}

/* about */
.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:center}
.about .pic{height:360px;border-radius:var(--r);box-shadow:0 30px 60px -30px rgba(20,52,23,.5)}
.about .pic::after{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.55);border-radius:calc(var(--r) - 8px);pointer-events:none}
.about .tx p{color:var(--mut);margin-bottom:10px;font-size:.9rem}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 20px}
.chip{display:flex;gap:10px;align-items:center;background:#fff;padding:8px 11px;border-radius:11px;font-size:.8rem;font-weight:500;box-shadow:0 4px 16px rgba(20,52,23,.06)}
.chip .ic{color:var(--g);width:15px;height:15px}
@media(max-width:900px){.about{grid-template-columns:1fr;gap:24px}.about .pic{height:260px}.chips{grid-template-columns:1fr 1fr}}

/* section banner slider */
.bn{position:relative;height:clamp(100px,36vw,var(--bnh,140px));border-radius:var(--r);overflow:hidden;margin-bottom:26px;box-shadow:0 30px 60px -34px rgba(20,52,23,.55);background:var(--deep)}
.bs{position:absolute;inset:0;opacity:0;transition:opacity .9s;pointer-events:none}
.bs.on{opacity:1}
.bs .m{position:absolute;inset:0}
.bs.on .m img{animation:kb 9s ease-out forwards}
.bs::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,30,12,.78),rgba(10,30,12,.05) 62%)}
.bcap{position:absolute;z-index:2;left:62px;bottom:18px;right:110px;color:#fff}
.bcap h3{font-size:clamp(1.1rem,2.2vw,1.55rem);font-weight:700}
.bcap p{font-size:.82rem;opacity:.9;margin-top:4px;max-width:420px}
.bn .arw{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:36px;height:36px}
.bn .pv{left:14px}.bn .nx{right:14px}
.bn .dots{bottom:14px;left:auto;right:20px;transform:none}
@media(max-width:600px){.bcap{left:18px;right:18px;bottom:36px}.bn .dots{left:50%;right:auto;transform:translateX(-50%)}.bn .arw{display:none}}

/* cards */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.ga{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 10px 30px -14px rgba(20,52,23,.25);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 44px -18px rgba(20,52,23,.35)}
.card .m{height:165px}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.tag{align-self:flex-start;font:600 .68rem/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:#7a5600;background:rgba(242,182,31,.25);padding:6px 11px;border-radius:99px;margin-bottom:10px}
.card h3{font-size:1.08rem;font-weight:700;color:var(--deep)}
.card p{font-size:.84rem;color:var(--mut);margin:6px 0 10px;line-height:1.5}
.feat{display:grid;gap:4px;margin-bottom:14px;font-size:.8rem;color:var(--ink)}
.feat li{display:flex;gap:7px;align-items:center}.feat .ic{color:var(--g);width:14px;height:14px}
.card .btn{margin-top:auto}
.alt{background:var(--sand)}
.dark{background:var(--deep);color:#fff}
.dark .head h2{color:#fff}.dark .head p{color:#c4d8b8}.dark .eyebrow{background:rgba(255,255,255,.12);color:var(--sun)}

/* pool tiles */
.tile{position:relative;height:230px;border-radius:var(--r);overflow:hidden;box-shadow:0 20px 40px -22px rgba(20,52,23,.5)}
.tile .m{position:absolute;inset:0;transition:transform .6s}.tile:hover .m{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,30,12,.8),transparent 60%)}
.tile .cp{position:absolute;z-index:2;left:18px;right:18px;bottom:15px;color:#fff}
.tile h3{font-size:1.08rem;font-weight:700}.tile p{font-size:.8rem;opacity:.9}

/* events */
.ev{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}
.ev .bn{margin:0;height:calc(var(--bnh,140px)*1.35)}
.ev .tx p{color:#c4d8b8;margin-bottom:6px}
.evl{margin:14px 0 20px;display:grid;gap:0}
.evl li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:.88rem}
.evl .ic{color:var(--sun);width:15px;height:15px}
@media(max-width:900px){.ev{grid-template-columns:1fr;gap:24px}.ev .bn{height:calc(var(--bnh,140px)*1.1)}}

/* food carousel */
.trk{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 16px;scrollbar-width:none}
.trk::-webkit-scrollbar{display:none}
.trk .card{min-width:230px;flex:0 0 230px;scroll-snap-align:start}
.ctl{display:flex;gap:10px;justify-content:center}
.ctl .arw{border-color:var(--g);color:var(--g);background:none}.ctl .arw:hover{background:var(--g);color:#fff}

/* activities */
.act{background:#fff;border-radius:var(--r);padding:20px 16px;text-align:center;box-shadow:0 10px 30px -16px rgba(20,52,23,.25);transition:.3s}
.act:hover{transform:translateY(-5px)}
.act .ico{width:46px;height:46px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g),#5aa23c);box-shadow:0 10px 18px -10px var(--g)}.act .ic{width:22px;height:22px}
.act h3{font-size:.98rem;font-weight:700;color:var(--deep)}.act p{font-size:.8rem;color:var(--mut);margin-top:6px}

/* gallery */
.fl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.fl button{border:1.5px solid rgba(47,107,47,.35);background:none;color:var(--g);padding:7px 16px;border-radius:99px;font:600 .8rem var(--b);cursor:pointer;transition:.2s}
.fl button:hover{border-color:var(--g)}.fl button.on{background:var(--g);color:#fff;border-color:var(--g)}
.gal{columns:4 200px;column-gap:10px}
.gi{margin-bottom:10px;border-radius:12px;break-inside:avoid;cursor:zoom-in;transition:transform .3s}
.gi:hover{transform:scale(1.02)}
.gi .m{height:180px}.gi:nth-child(3n+2) .m{height:235px}.gi:nth-child(4n+3) .m{height:150px}
.gi.hide{display:none}
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,20,9,.94);display:none;place-items:center;padding:24px}
.lb.on{display:grid}.lb img{max-width:92vw;max-height:86vh;border-radius:12px;object-fit:contain}
.lb .arw{position:absolute;top:50%;transform:translateY(-50%)}.lb .pv{left:18px}.lb .nx{right:18px}
.lb .x{position:absolute;top:18px;right:18px}

/* social */
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.sb{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:99px;color:#fff;font-weight:600;font-size:.82rem;transition:.2s;box-shadow:0 10px 22px -12px rgba(0,0,0,.5)}
.sb:hover{transform:translateY(-3px)}.sb .ic{width:17px;height:17px}
.sb.facebook{background:#1877f2}.sb.instagram{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}.sb.tiktok{background:#111}.sb.x{background:#000}
.emb{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.emb>*{max-width:100%}
.nofeed{max-width:560px;margin:0 auto;text-align:center;color:var(--mut);font-size:.9rem;border:2px dashed rgba(47,107,47,.3);border-radius:var(--r);padding:16px}

/* booking */
.bk{display:grid;grid-template-columns:1fr 1.2fr;gap:36px;align-items:start}
.bk .tx p{color:#c4d8b8}
.chn{display:grid;gap:8px;margin-top:18px}
.chn a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:.2s}
.chn a:hover{background:rgba(255,255,255,.16);transform:translateX(4px)}
.chn .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sun);color:#2b1f00}
.chn .wa .ico{background:#25d366;color:#fff}.chn .ic{width:18px;height:18px}
.chn b{display:block;font-size:.88rem}.chn span{font-size:.76rem;opacity:.75}
.fm{background:#fff;color:var(--ink);padding:22px;border-radius:var(--r);display:grid;grid-template-columns:1fr 1fr;gap:11px;box-shadow:0 30px 60px -28px rgba(0,0,0,.6)}
.fm h3{grid-column:1/-1;font-size:1.15rem;font-weight:700;color:var(--deep)}
.fm label{display:grid;gap:4px;font:600 .68rem var(--b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.fm .full{grid-column:1/-1}
.fm input,.fm select,.fm textarea{font:400 .88rem var(--b);padding:9px 12px;border:1.5px solid #dfe6d4;border-radius:10px;background:#fbfcf8;width:100%;color:var(--ink);text-transform:none;letter-spacing:0}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 4px rgba(47,107,47,.12)}
.fm .note{grid-column:1/-1;font-size:.72rem;color:var(--mut);margin-top:-2px}
@media(max-width:900px){.bk{grid-template-columns:1fr;gap:22px}.fm{grid-template-columns:1fr 1fr;padding:18px}}@media(max-width:520px){.fm{grid-template-columns:1fr}}

/* contact */
.ct{display:grid;grid-template-columns:.9fr 1.1fr;gap:0;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -36px rgba(20,52,23,.55);background:#fff}
.ct .info{background:linear-gradient(160deg,var(--deep),#245a28);color:#fff;padding:26px 28px;position:relative;overflow:hidden}
.ct .info::after{content:"";position:absolute;right:-90px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:rgba(242,182,31,.12)}
.ct .info h3{font-size:1.3rem;font-weight:700}
.ct .info>p{font-size:.82rem;opacity:.8;margin:4px 0 14px}
.cr{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.12)}
.cr .ico{width:34px;height:34px;border-radius:10px;background:rgba(242,182,31,.16);color:var(--sun);display:grid;place-items:center;flex:none}
.cr .ic{width:17px;height:17px}.cr small{display:block;font:600 .6rem var(--b);letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.cr b,.cr a{font-weight:500;font-size:.88rem}.cr a:hover{color:var(--sun)}
.ct .sl{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.ct .sl a{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;transition:.2s}
.ct .sl a:hover{background:var(--sun);color:#2b1f00;transform:translateY(-3px)}.ct .sl .ic{width:16px;height:16px}
.ct .right{display:flex;flex-direction:column}
.ct iframe{border:0;width:100%;flex:1;min-height:250px}
.ct .bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#fff}
@media(max-width:900px){.ct{grid-template-columns:1fr}.ct .info{padding:22px 20px}}
.msg{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.msg .full{grid-column:1/-1}
@media(max-width:700px){.msg{grid-template-columns:1fr}}

footer{background:#0d2410;color:#bcd0b0;padding:38px 0 18px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;margin-bottom:24px}
.fg h4{color:#fff;font-size:.92rem;margin-bottom:8px}
.fg li{margin:5px 0;font-size:.84rem}.fg a:hover{color:var(--sun)}
.fg .brand{color:#fff;margin-bottom:10px}
.fg p{font-size:.82rem;max-width:320px}

}

function slider(root,sel,auto){
  var sl=$$(sel,root);if(sl.length<2)return;var cur=0,t,dots=$('.dots',root);
  if(dots)dots.innerHTML=sl.map(function(_,i){return'<button aria-label="Slide '+(i+1)+'"></button>'}).join('');
  function go(i){cur=(i+sl.length)%sl.length;sl.forEach(function(s,k){s.classList.toggle('on',k===cur)});if(dots)$$('button',dots).forEach(function(d,k){d.classList.toggle('on',k===cur)});clearInterval(t);t=setInterval(function(){go(cur+1)},auto)}
  if(dots)$$('button',dots).forEach(function(d,k){d.onclick=function(){go(k)}});
  var p=$('.pv',root),n=$('.nx',root);if(p)p.onclick=function(){go(cur-1)};if(n)n.onclick=function(){go(cur+1)};go(0);
}

var MD={k:'',i:0,g:0};
function mdArr(k){return k==='rooms'?D.rooms:k==='grounds'?D.grounds:D.food}
function mdImgs(it){return[it.img].concat(it.gallery||[]).filter(Boolean)}
function closeMd(){var m=$('#md');m.hidden=true;m.innerHTML='';document.body.classList.remove('nos')}
function drawMd(){
  var k=MD.k,arr=mdArr(k),it=arr[MD.i];if(!it)return;
  var name=it.name||it.title,imgs=mdImgs(it);if(MD.g>=imgs.length)MD.g=0;
  var cfg={rooms:['Book this room','Hello, I would like to book '+name+' at '+S.name+'.',it.tag||'Room'],grounds:['Plan a visit','Hello, I would like to know more about the '+name+' at '+S.name+'.','Grounds'],food:['Order or enquire','Hello, I would like to enquire about '+name+' at '+S.name+'.','Food & catering']}[k];
  var list=k==='rooms'?lines(it.features):lines(it.highlights);
  var paras=String(it.details||it.desc||'').split(/\n\s*\n/).filter(Boolean);
  var main='<div class="mainp">'+media(imgs[MD.g]||'',name)+(imgs.length>1?'<button class="arw pv" data-gn="-1" aria-label="Previous photo">'+IC('left',18)+'</button><button class="arw nx" data-gn="1" aria-label="Next photo">'+IC('right',18)+'</button>':'')+'</div>';
  var th=imgs.length>1?'<div class="th">'+imgs.map(function(src,j){return'<button data-gi="'+j+'" class="'+(j===MD.g?'on':'')+'" aria-label="Photo '+(j+1)+'"><img src="'+esc(src)+'" alt=""></button>'}).join('')+'</div>':'';
  var others=arr.map(function(o,j){return j===MD.i?'':'<button data-sw="'+j+'">'+esc(o.name||o.title)+'</button>'}).join('');
  $('#md').innerHTML='<div class="mb" role="dialog" aria-modal="true" aria-label="'+esc(name)+'"><button class="arw x" data-close aria-label="Close">'+IC('close',18)+'</button><div class="gl">'+main+th+'</div><div class="ct2"><span class="eyebrow" style="align-self:flex-start">'+esc(cfg[2])+'</span><h3>'+esc(name)+'</h3>'+(it.price?'<span class="pr">'+IC('star',15)+esc(it.price)+'</span>':'')+'<div class="txt">'+paras.map(function(p){return'<p>'+esc(p)+'</p>'}).join('')+'</div>'+(list.length?'<ul class="hl">'+list.map(function(f){return'<li>'+IC('check',14)+esc(f)+'</li>'}).join('')+'</ul>':'')+
   '<div class="acts2"><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="'+wa(cfg[1])+'">'+IC('whatsapp',16)+esc(cfg[0])+'</a><a class="btn btn-out btn-sm" href="tel:+'+digits(S.whatsapp)+'">'+IC('phone',16)+'Call</a><a class="btn btn-green btn-sm" href="#book" data-close>'+IC('calendar',16)+'Booking form</a>'+(k==='rooms'&&S.bookingUrl?'<a class="btn btn-out btn-sm" target="_blank" rel="noopener" href="'+esc(S.bookingUrl)+'">'+IC('globe',16)+'Booking.com</a>':'')+'</div>'+
   (others?'<div class="more2"><b>More '+(k==='rooms'?'rooms and blocks':k==='grounds'?'to explore':'from the kitchen')+'</b><div>'+others+'</div></div>':'')+'</div></div>';
}
function openMd(k,i){MD.k=k;MD.i=i;MD.g=0;drawMd();$('#md').hidden=false;document.body.classList.add('nos');var b=$('#md .x');if(b)b.focus()}
function resetActs(){var p=$('#actp');p.hidden=true;p.dataset.i='';$$('#acts .act').forEach(function(b){b.classList.remove('on');b.setAttribute('aria-expanded','false')})}
function openAct(i){
  var a=D.activities[i],p=$('#actp'),same=!p.hidden&&p.dataset.i===String(i);
  if(same){resetActs();return}
  $$('#acts .act').forEach(function(b,j){b.classList.toggle('on',j===i);b.setAttribute('aria-expanded',j===i?'true':'false')});
  var items=a.items||[];p.dataset.i=i;
  p.innerHTML='<div class="apin"><div class="aph"><span class="ico">'+IC(a.icon,22)+'</span><div><h3>'+esc(a.title)+'</h3><p>'+esc(a.details||a.desc)+'</p></div><button class="arw" data-actclose aria-label="Close">'+IC('close',18)+'</button></div>'+
   (items.length?'<div class="aitems">'+items.map(function(t){return'<div class="ait">'+(t.img?media(t.img,t.title):'')+'<div class="bd"><h4>'+(t.img?'':IC('check',15))+esc(t.title)+'</h4>'+(t.desc?'<p>'+esc(t.desc)+'</p>':'')+'</div></div>'}).join('')+'</div>':'')+
   '<div class="acta"><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="'+wa('Hello, I would like to know more about '+String(a.title).toLowerCase()+' at '+S.name+'.')+'">'+IC('whatsapp',16)+'Ask about '+esc(String(a.title).toLowerCase())+'</a><a class="btn btn-green btn-sm" href="#book">'+IC('calendar',16)+'Book a stay</a></div></div>';
  p.hidden=false;p.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function wire(){
  $$('[data-sl]').forEach(function(r){slider(r,r.hasAttribute('data-hero')?'.hs':'.bs',r.hasAttribute('data-hero')?6500:5200)});
  var hd=$('#hdr');var sc=function(){hd.classList.toggle('solid',scrollY>40)};addEventListener('scroll',sc);sc();
  $('#bg').onclick=function(){$('#mn').classList.toggle('open')};$$('#mn a').forEach(function(a){a.onclick=function(){$('#mn').classList.remove('open')}});
  var tr=$('#trk');$('#fn').onclick=function(){tr.scrollBy({left:312,behavior:'smooth'})};$('#fp').onclick=function(){tr.scrollBy({left:-312,behavior:'smooth'})};
  // gallery
  var gi=$$('.gi'),lb=$('#lb'),li=0,vis=[];
  $$('#fl button').forEach(function(b){b.onclick=function(){$$('#fl button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');gi.forEach(function(g){g.classList.toggle('hide',b.dataset.f!=='all'&&g.dataset.c!==b.dataset.f)})}});
  function show(i){vis=gi.filter(function(g){return!g.classList.contains('hide')&&g.dataset.s});if(!vis.length)return;li=(i+vis.length)%vis.length;$('img',lb).src=vis[li].dataset.s;lb.classList.add('on')}
  gi.forEach(function(g){g.onclick=function(){vis=gi.filter(function(x){return!x.classList.contains('hide')&&x.dataset.s});var k=vis.indexOf(g);if(k>-1)show(k)}});
  $('.x',lb).onclick=function(){lb.classList.remove('on')};$('.pv',lb).onclick=function(){show(li-1)};$('.nx',lb).onclick=function(){show(li+1)};
  lb.onclick=function(e){if(e.target===lb)lb.classList.remove('on')};
  addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(li-1);if(e.key==='ArrowRight')show(li+1)});
  // forms
  $('#bf').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));window.open(wa('Hello '+S.name+', I would like to enquire.\nName: '+d.name+'\nPhone: '+d.phone+'\nCheck-in: '+d.in+'\nCheck-out: '+d.out+'\nGuests: '+d.guests+'\nInterested in: '+d.type+(d.msg?'\n'+d.msg:'')),'_blank')};
  $('#cf').onsubmit=function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target));window.open(wa('Hello '+S.name+',\nName: '+d.name+'\nContact: '+d.contact+(d.subject?'\nSubject: '+d.subject:'')+'\n'+d.msg),'_blank')};
  // details modal + activities
  document.addEventListener('click',function(e){
    var t=e.target;
    var c=t.closest('[data-k]');if(c&&!t.closest('a')){openMd(c.dataset.k,+c.dataset.i);return}
    var a=t.closest('[data-a]');if(a){openAct(+a.dataset.a);return}
    if(t.closest('[data-actclose]')){resetActs();return}
    var m=$('#md');if(m.hidden)return;
    if(t===m||t.closest('[data-close]')){closeMd();return}
    var sw=t.closest('[data-sw]');if(sw){MD.i=+sw.dataset.sw;MD.g=0;drawMd();$('#md .mb').scrollTop=0;return}
    var gi=t.closest('[data-gi]');if(gi){MD.g=+gi.dataset.gi;drawMd();return}
    var gn=t.closest('[data-gn]');if(gn){var n=mdImgs(mdArr(MD.k)[MD.i]).length;MD.g=(MD.g+(+gn.dataset.gn)+n)%n;drawMd()}
  });
  document.addEventListener('keydown',function(e){
    var m=$('#md');
    if(!m.hidden){if(e.key==='Escape')closeMd();if(e.key==='ArrowLeft'||e.key==='ArrowRight'){var b=$('#md [data-gn="'+(e.key==='ArrowLeft'?-1:1)+'"]');if(b)b.click()}return}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.tile[data-k]')){e.preventDefault();openMd(e.target.dataset.k,+e.target.dataset.i)}
  });
  // reveal
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.1});$$('.rv').forEach(function(el){io.observe(el)});
}

function idbGet(k){return new Promise(function(res){try{var r=indexedDB.open('plantains-admin',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onerror=function(){res(null)};r.onsuccess=function(){var q=r.result.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}}catch(e){res(null)}})}

if(/[?&]preview/.test(location.search)){idbGet('draft').then(function(d){if(d)D=d;render();var r=document.createElement('div');r.className='ribbon';r.textContent='Preview of unpublished admin changes';document.body.appendChild(r)})}else render();
})();
</script>
